services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  pose_api:
    build:
      context: .
      dockerfile: services/Dockerfile.pose
    container_name: pose_visualization_service
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  ollama_data:

[project]
name = "mlops2025-lesson6-rag-animation"
version = "0.1.0"
description = "MLOps 2025, lesson 6: RAG system that turns a text request into a GIF animation"
authors = [{ name = "Arsen Ziyadinov" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai (>=1.12,<3.0)",
    "requests (>=2.31,<3.0)",
    "scikit-learn (>=1.4,<2.0)",
    "numpy (>=1.24,<3.0)",
    "pillow (>=10.0,<12.0)",
    "matplotlib (>=3.8,<4.0)",
    "fastapi (>=0.104,<1.0)",
    "uvicorn (>=0.24,<1.0)",
    "pydantic (>=2.5,<3.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pre-commit = "^4.0"
black = "^24.10"
ruff = "^0.8"
isort = "^5.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E402"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
